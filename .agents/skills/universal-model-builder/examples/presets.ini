# Universal Multi-Platform llama-server Presets Template

# -----------------------------------------------------------------------------
# 1. macOS Apple Silicon (Metal MPS - Unified Memory)
# -----------------------------------------------------------------------------
[Mac-Metal-Target]
model = /path/to/target-model-14b-q5_k_m.gguf
alias = target-model,apex-code-target
ctx-size = 32768
parallel = 1
n-gpu-layers = 99
threads = 8
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0

[Mac-Metal-Speculative]
model = /path/to/target-model-14b-q5_k_m.gguf
model-draft = /path/to/draft-model-0.5b-q8_0.gguf
alias = target-spec,apex-code-spec
ctx-size = 32768
parallel = 1
n-gpu-layers = 99
n-gpu-layers-draft = 99
spec-draft-n-max = 6
threads = 8
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0

# -----------------------------------------------------------------------------
# 2. Linux x86_64 Discrete GPU (Vulkan RADV / 4GB GDDR6 VRAM)
# -----------------------------------------------------------------------------
[Linux-Vulkan-Target]
model = /path/to/target-model-7b-iq3_m.gguf
alias = vulkan-target,apex-code-vulkan
ctx-size = 8192
parallel = 1
n-gpu-layers = 99
batch-size = 256
ubatch-size = 64
threads = 8
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0

# -----------------------------------------------------------------------------
# 3. Linux/Windows x86_64 Host CPU & DDR4 RAM (No dGPU)
# -----------------------------------------------------------------------------
[CPU-FastPath-Target]
model = /path/to/target-model-3b-q4_k_m.gguf
alias = cpu-target,apex-code-cpu
ctx-size = 8192
parallel = 1
n-gpu-layers = 0
threads = 8
flash-attn = off
cache-type-k = f16
cache-type-v = f16
